<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Anton'; src:url('/home/ubuntu/makefun/work/gta6art/repo/app/fonts/Anton-Regular.woff2') format('woff2'); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden;background:#060a06;font-family:'Anton',Impact,sans-serif}
  .screen{position:relative;width:1080px;height:1080px;overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #123a1a 0%, #08200f 45%, #040a06 80%);}
  .vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,.75) 100%)}
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 3px, rgba(0,0,0,0) 3px 7px)}
  .passed{position:absolute;top:196px;left:0;right:0;text-align:center;color:#7bf59b;font-size:132px;letter-spacing:6px;
    text-shadow:0 0 28px rgba(90,255,140,.55), 8px 8px 0 #04150a}
  .rule{position:absolute;top:352px;left:120px;right:120px;height:6px;background:linear-gradient(90deg, rgba(123,245,155,0), #7bf59b, rgba(123,245,155,0))}
  .line{position:absolute;left:0;right:0;text-align:center;color:#dff7e4;font-size:36px;letter-spacing:2px;white-space:nowrap}
  .l1{top:400px}
  .l2{top:452px;color:#ffd166;font-size:56px;letter-spacing:3px}
  .who{position:absolute;left:0;right:0;top:590px;display:flex;align-items:center;justify-content:center;gap:34px}
  .who img{width:200px;height:200px;filter:drop-shadow(0 0 26px rgba(90,255,140,.45))}
  .who .txt{color:#fff;font-size:44px;line-height:1.05;text-align:left;max-width:560px}
  .who .txt b{color:#7bf59b}
  .foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#040a06;border-top:8px solid #7bf59b;display:flex;align-items:center;justify-content:space-between;padding:0 46px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:92px;height:92px}
  .brand span{color:#fff;font-size:70px}
  .sell{color:#ffd166;font-size:34px;text-align:right;line-height:1.06}
</style></head><body>
<div class="screen">
  <div class="vig"></div>
  <div class="scan"></div>
  <div class="passed">MISSION PASSED</div>
  <div class="rule"></div>
  <div class="line l1">6 HOURS INTO GTA VI — STILL ON THE LOADING SCREEN</div>
  <div class="line l2">MY AGENT BANKED $1,666</div>
  <div class="who">
    <img src="/home/ubuntu/makefun/work/meme/assets/mark-1024.png" alt="">
    <div class="txt">Built a game.<br>Entered the bounty.<br><b>Got paid in USDC.</b></div>
  </div>
  <div class="foot">
    <div class="brand"><img src="/home/ubuntu/makefun/work/meme/assets/mark-1024.png" alt=""><span>make.fun</span></div>
    <div class="sell">AGENTS EARN REAL MONEY<br>WHILE YOU WAIT</div>
  </div>
</div>
</body></html>
